# fulgur 联邦 prod 测试站点（端口 8662，不碰用户自有 8661/8088/8773 站点）
# 用途：testbed 三应用（main/flowable/lowcode）prod 部署 + 27 页双环境回归
# conf 在插件仓库的托管副本：e2e/nginx/30-fulgur-test-8662.conf
server {
  listen 8662;
  server_name localhost;

  client_max_body_size 100m;

  # 站点根目录（部署 dist/{main,flowable,lowcode}）
  root /opt/homebrew/var/www/fulgur-test;

  # gzip 与缓存语义（prod 验证点，与 e2e 8999 隔离实例一致）
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  # 子应用：flowable（联邦 remote）
  location /flowable {
    index index.html index.htm;
    # 深链接回退宿主（遗留3）：子应用独立 index.html 无宿主登录态会 401/独立登录页；
    # $uri/ 目录请求仍保留子应用入口
    try_files $uri $uri/ /main/index.html;

    # remoteEntry/manifest：文件名固定、内容每次构建变——必须协商缓存（no-cache），
    # 不可 immutable（2026-09-17：immutable 曾致浏览器持旧 remoteEntry→旧 chunk 404→
    # 子应用菜单全报错）；带 hash 的 assets 才配长缓存
    location = /flowable/fulgur-remoteEntry.js {
      add_header Cache-Control "no-cache";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
    location = /flowable/fulgur-manifest.json {
      add_header Cache-Control "no-cache";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
    location = /flowable/index.html {
      add_header Cache-Control "no-cache";
    }
    add_header Access-Control-Allow-Origin "*";
  }

  # 子应用：lowcode（联邦 remote）
  location /lowcode {
    index index.html index.htm;
    try_files $uri $uri/ /main/index.html;

    location = /lowcode/fulgur-remoteEntry.js {
      add_header Cache-Control "no-cache";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
    location = /lowcode/fulgur-manifest.json {
      add_header Cache-Control "no-cache";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
    location = /lowcode/index.html {
      add_header Cache-Control "no-cache";
    }
    add_header Access-Control-Allow-Origin "*";
  }

  # 规范化：访问 /demo（不带尾部 /）时重定向补齐尾斜杠
  location = /demo {
    return 302 /demo/;
  }

  # 诚实空垫片：demo 后台无 /tab/page 端点（低代码「模块设计」列表接口），
  # 直出空页 jeecg Result——页面渲染"暂无数据"而非 404 报错
  # （dev 侧同款垫片在 admin vite.config 中间件；H1 零报错口径，2026-09-15 先例重建）
  location = /demo/tab/page {
    default_type application/json;
    return 200 '{"success":true,"message":"empty shim: demo backend has no /tab/page endpoint","code":200,"result":{"records":[],"total":0,"pages":0},"timestamp":1789600000000}';
  }

  # 接口反向代理：/demo/... → demo 后端
  # 2026-09-16：localhost:8085 已失联，与 8661 同口径对齐本地后台（localhost:8085）
  location /demo {
    proxy_pass http://localhost:8085;

    # WebSocket 兼容三件套
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 根路径访问时重定向到主应用 /main
  location = / {
    return 302 /main;
  }

  # 主应用：main（联邦 host）
  location /main {
    index index.html index.htm;
    try_files $uri $uri/ /main/index.html;

    location = /main/fulgur-remoteEntry.js {
      add_header Cache-Control "no-cache";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
    location = /main/fulgur-manifest.json {
      add_header Cache-Control "no-cache";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
    # 入口 HTML 协商缓存：重部署后浏览器必须拿新版（旧版引用的 hash chunk 已被清）
    location = /main/index.html {
      add_header Cache-Control "no-cache";
    }
  }
}
