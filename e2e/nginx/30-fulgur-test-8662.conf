# fulgur 联邦 prod 测试站点（端口 8662，不碰用户自有 8661/8088/8773 站点）
# 用途：testbed 三应用（main/flowable/lowcode）prod 部署 + 27 页双环境回归
# conf 在插件仓库的托管副本：e2e/nginx/30-fulgur-test-8662.conf
server {
  listen 8662;
  server_name localhost;

  client_max_body_size 100m;

  # 站点根目录（部署 dist/{main,flowable,lowcode}）
  root /opt/homebrew/var/www/fulgur-test;

  # gzip 与缓存语义（prod 验证点，与 e2e 8999 隔离实例一致）
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  # 子应用：flowable（联邦 remote）
  location /flowable {
    index index.html index.htm;
    # 深链接回退宿主（遗留3）：子应用独立 index.html 无宿主登录态会 401/独立登录页；
    # $uri/ 目录请求仍保留子应用入口
    try_files $uri $uri/ /main/index.html;

    # remoteEntry 长缓存 + 跨域模块访问
    location = /flowable/fulgur-remoteEntry.js {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
    add_header Access-Control-Allow-Origin "*";
  }

  # 子应用：lowcode（联邦 remote）
  location /lowcode {
    index index.html index.htm;
    try_files $uri $uri/ /main/index.html;

    location = /lowcode/fulgur-remoteEntry.js {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
    add_header Access-Control-Allow-Origin "*";
  }

  # 规范化：访问 /demo（不带尾部 /）时重定向补齐尾斜杠
  location = /demo {
    return 302 /demo/;
  }

  # 接口反向代理：/demo/... → demo 后端
  # 2026-09-16：localhost:8085 已失联，与 8661 同口径对齐本地后台（localhost:8085）
  location /demo {
    proxy_pass http://localhost:8085;

    # WebSocket 兼容三件套
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 根路径访问时重定向到主应用 /main
  location = / {
    return 302 /main;
  }

  # 主应用：main（联邦 host）
  location /main {
    index index.html index.htm;
    try_files $uri $uri/ /main/index.html;

    location = /main/fulgur-remoteEntry.js {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Expose-Headers "*";
    }
  }
}
