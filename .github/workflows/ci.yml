name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/plugin/pnpm-lock.yaml
      - name: Install
        working-directory: packages/plugin
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Unit tests
        working-directory: packages/plugin
        run: pnpm test
      - name: Typecheck (pinned TS)
        working-directory: packages/plugin
        run: pnpm typecheck
      - name: Typecheck (latest TS — 防 CLI 绿 IDE 红)
        working-directory: packages/plugin
        run: pnpm typecheck:latest
      - name: Build + gzip gate
        working-directory: packages/plugin
        run: pnpm build
