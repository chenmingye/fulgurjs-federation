name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install（npm：esbuild postinstall 需可执行，pnpm11 CI 批准机制不适用）
        working-directory: packages/plugin
        run: npm install --no-audit --no-fund
      - name: Build + gzip gate
        working-directory: packages/plugin
        run: npm run build
      - name: Unit tests
        working-directory: packages/plugin
        run: npm test
      - name: Typecheck (pinned TS)
        working-directory: packages/plugin
        run: npm run typecheck
      - name: Typecheck (latest TS — 防 CLI 绿 IDE 红)
        working-directory: packages/plugin
        run: npm run typecheck:latest
