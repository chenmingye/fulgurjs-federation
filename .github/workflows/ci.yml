name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 每周一 03:00 UTC：Vite 5.1 最低支持线定时兼容（不进 PR 矩阵，避免成本翻倍）
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  examples-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check public examples and launcher failures
        run: npm run test:examples

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install（npm：esbuild postinstall 需可执行，pnpm11 CI 批准机制不适用）
        working-directory: packages/plugin
        run: npm install --no-audit --no-fund
      - name: Build + 门禁（gzip 体积 / 错误码三方一致性）
        working-directory: packages/plugin
        run: npm run build
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install fixtures host-vue deps（D6 产物形态用例经 fixtures 解析 vue/vue-router；link 协议须 pnpm）
        working-directory: fixtures/host-vue
        run: CI=true pnpm install --no-frozen-lockfile
      - name: Jeecg editor lifecycle regression
        run: npm --prefix e2e run test:editor-lifecycle
      - name: Unit tests
        working-directory: packages/plugin
        run: npm test
      - name: Typecheck (pinned TS)
        working-directory: packages/plugin
        run: npm run typecheck
      - name: Typecheck (latest TS — 防 CLI 绿 IDE 红)
        working-directory: packages/plugin
        run: npm run typecheck:latest

  # 集成 e2e + Vite 兼容矩阵：README 声明 Vue3 + Vite5~8，5 由 peer 范围保证 + vite5 定时作业，
  # PR 矩阵守 6/7/8（成本考虑）。prod 套件见下方 prod-e2e 作业（runner 内 apt 装 NGINX）。
  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    # 超时兜底：若用例因环境差异卡住（曾出现步骤 40 分钟不退出），20 分钟强制失败并留下日志
    strategy:
      fail-fast: false
      matrix:
        vite: [6.4.3, 7.3.6, 8.3.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install + build plugin
        working-directory: packages/plugin
        run: |
          npm install --no-audit --no-fund
          npm run build
        # 用 npm 与 test 作业同路径；dist 运行时依赖（es-module-lexer / magic-string）须就地安装，
        # 否则 fixtures 经 link: 消费插件时报 ERR_MODULE_NOT_FOUND
      - name: Install fixtures + e2e
        env:
          VITE_VERSION: ${{ matrix.vite }}
        run: bash e2e/scripts/ci-install-fixtures.sh
        # fixtures 以 link: 协议依赖本地插件，npm 不支持该协议（EUNSUPPORTEDPROTOCOL）→ 必须 pnpm
      - name: Playwright chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: e2e（dev + fault + bridge + router）
        run: bash e2e/scripts/ci-dev.sh
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-vite-${{ matrix.vite }}
          path: |
            e2e/artifacts
            artifacts/playwright-report
            /tmp/fulgurjs-ci-dev



  # WP3：Vite 5.1 最低支持线定时兼容（peer 声明 >=5.1.0；@vitejs/plugin-vue@5 与 Vite5 peer 匹配）
  vite5:
    # 6.0.0 起随每次 push 实跑（上轮最终 CI 曾 skipped——声明支持的主版本必须实跑，不靠总状态绿）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install + build plugin
        working-directory: packages/plugin
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install fixtures（Vite 5.1 + 匹配 Vue/React 插件）
        env:
          VITE_VERSION: 5.1.8
        run: bash e2e/scripts/ci-install-fixtures.sh
      - name: Playwright chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: e2e（dev + fault + bridge + router，Vite 5.1）
        run: bash e2e/scripts/ci-dev.sh
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-vite5
          path: |
            e2e/artifacts
            artifacts/playwright-report
            /tmp/fulgurjs-ci-dev


  # WP3：prod e2e（构建全部 fixtures + 隔离 NGINX，prod-setup.sh 全程 mktemp/动态端口/--stop 自清理）
  prod-e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 6.x = 基线生产路径；8.x = rolldown 生产路径（V8-SYNC-FACADE 后全量纳入）
        vite: [6.4.3, 8.3.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install NGINX（隔离实例，独立 conf/pid，不接触系统服务）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx
      - name: Install + build plugin
        working-directory: packages/plugin
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install fixtures + e2e
        env:
          VITE_VERSION: ${{ matrix.vite }}
        run: bash e2e/scripts/ci-install-fixtures.sh
      - name: Playwright chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: prod 构建 + 隔离 NGINX 启动
        run: bash e2e/scripts/prod-setup.sh
      - name: e2e（prod 套件）
        run: |
          set +e
          SKIP_DEV_SERVERS=1 pnpm --dir e2e exec playwright test --project=prod --project=prod-react --project=bridge-prod --global-timeout=600000
          code=$?
          if [ $code -ne 0 ]; then
            echo "--- 失败时的 NGINX/环境上下文 ---"
            python3 -c "import json;d=json.load(open('e2e/.prod-nginx.json'));print(d)" || true
            T=$(python3 -c "import json;print(json.load(open('e2e/.prod-nginx.json'))['tmpDir'])" 2>/dev/null || true)
            [ -n "$T" ] && tail -30 "$T/error.log" 2>/dev/null || true
          fi
          exit $code
      - name: Stop isolated NGINX
        if: always()
        run: bash e2e/scripts/prod-setup.sh --stop
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-browser-vite-${{ matrix.vite }}
          path: |
            e2e/artifacts
            artifacts/playwright-report


  # WP3：npm tarball consumer smoke（发布产物可解析/可构建/可 dev，不依赖 link:）
  tarball:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install + build plugin
        working-directory: packages/plugin
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: tarball smoke（pack → 临时 consumer 安装 → exports/类型/build/dev 加载）
        run: node e2e/scripts/pack-smoke.mjs

  bridge-versions:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vite: [6.4.3, 8.3.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build candidate plugin
        working-directory: packages/plugin
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install locked demos and select engine
        run: |
          npm --prefix examples/demos/react-versions ci --no-audit --no-fund
          for app in host remote18 remote18-strict remote19 vue-host; do
            npm --prefix "examples/demos/react-versions/$app" ci --no-audit --no-fund
            npm --prefix "examples/demos/react-versions/$app" install --no-save --package-lock=false "vite@${{ matrix.vite }}" --no-audit --no-fund
            cp -R packages/plugin/dist/. "examples/demos/react-versions/$app/node_modules/@fulgurjs/federation/dist/"
          done
          cd examples/demos/react-versions
          npx playwright install --with-deps chromium
      - name: Browser acceptance (dev and production)
        env:
          FULGURJS_ACCEPTANCE_STAGE: source-candidate
        working-directory: examples/demos/react-versions
        run: |
          npm run test:dev
          npm run test:prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-versions-vite-${{ matrix.vite }}
          path: examples/.run/react-versions/
