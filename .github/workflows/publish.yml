name: Publish

# Trusted Publishing：npmjs.com 包设置绑定本仓库 + publish.yml 后，
# 打 GitHub Release 即自动 npm publish（--provenance）。
# 本地 token 通道保留为回退（docs/trusted-publishing-迁移清单.md）。

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        working-directory: packages/plugin
        run: npm install --no-audit --no-fund
      - name: Build + gzip gate
        working-directory: packages/plugin
        run: npm run build
      - name: Unit tests
        working-directory: packages/plugin
        run: npm test
      - name: Publish
        working-directory: packages/plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag prerelease
          else
            npm publish --provenance --access public
          fi
