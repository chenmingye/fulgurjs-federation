<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1280 1550" width="1280" height="1550" role="img" lang="zh-CN" aria-labelledby="title description"><title id="title">fulgurjs：系统架构与三条使用路径</title><desc id="description">开发构建、资源服务、浏览器执行；三条路径不互为前置。</desc><style>:root{--bg:#fff;--text:#172b43;--muted:#465c72;--line:#526b85;--tool:#e8f5ef;--run:#e6f5fc;--resource:#fff3df;--note:#f1f4f8;--error:#fff0f1;--error-line:#b91c36;--border:#c1ccd8} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}} :root[data-theme="dark"]{--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}
.diagram{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text)}
.diagram .background{fill:var(--bg)}.diagram text{fill:var(--text)}
.diagram .heading{font-size:25px;font-weight:700}.diagram .section{font-size:18px;font-weight:700}
.diagram .title{font-size:18px;font-weight:700}.diagram .body{font-size:15px;fill:var(--muted)}
.diagram .edge-label{font-size:14px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.diagram .box{stroke:var(--border);stroke-width:1.5;fill:var(--note)}
.diagram .tool{fill:var(--tool)}.diagram .run{fill:var(--run)}.diagram .resource{fill:var(--resource)}
.diagram .error{fill:var(--error);stroke:var(--error-line)}
.diagram .boundary{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:7 5}
.diagram .edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}
.diagram .optional{stroke-dasharray:7 5}.diagram .failure{stroke:var(--error-line);marker-end:url(#error-arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--line)"/></marker><marker id="error-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--error-line)"/></marker></defs><rect class="background" width="1280" height="1550"/><text class="heading" x="30" y="40">fulgurjs：系统架构与三条使用路径</text><path class="edge " d="M 235 214 L 235 240 L 440 240 L 440 260"/><path class="edge " d="M 645 214 L 645 260"/><path class="edge optional" d="M 1000 354 L 1050 354 L 1050 390"/><path class="edge " d="M 440 354 L 440 370 L 235 370 L 235 390"/><path class="edge " d="M 640 354 L 640 390"/><path class="edge optional" d="M 645 490 L 645 565 L 325 565 L 325 575"/><path class="edge " d="M 610 630 L 670 630"/><path class="edge optional" d="M 235 490 L 235 515 L 955 515 L 955 575"/><path class="edge " d="M 645 825 L 645 790 L 955 790 L 955 690"/><path class="edge " d="M 235 882 L 450 882"/><path class="edge " d="M 840 882 L 860 882"/><path class="edge " d="M 235 1020 L 235 980 L 580 980 L 580 940"/><path class="edge " d="M 645 1020 L 645 940"/><path class="edge " d="M 1050 1020 L 1050 960 L 770 960 L 770 940"/><path class="edge optional" d="M 840 910 L 850 910 L 850 1230 L 645 1230 L 645 1260"/><path class="edge " d="M 1050 1160 L 1050 1260"/><path class="edge optional" d="M 235 1260 L 235 1230 L 10 1230 L 10 735 L 955 735 L 955 690"/><rect class="boundary" x="20" y="70" width="1240" height="440" rx="16"/><text x="38" y="99" class="section" text-anchor="start"><tspan x="38" dy="0">① 本地 Node.js 工具链：宿主与远程各自接入</tspan></text><g data-node="host"><rect class="box tool" x="40" y="120" width="390" height="94" rx="12"/><text x="235" y="151" class="title" text-anchor="middle"><tspan x="235" dy="0">宿主源码与配置</tspan></text><text x="235" y="179" class="body" text-anchor="middle"><tspan x="235" dy="0">fulgurjs.config.ts + vite.config.ts</tspan></text></g><g data-node="remote"><rect class="box tool" x="450" y="120" width="390" height="94" rx="12"/><text x="645" y="151" class="title" text-anchor="middle"><tspan x="645" dy="0">远程源码与配置</tspan></text><text x="645" y="179" class="body" text-anchor="middle"><tspan x="645" dy="0">exposes / setup / remotes / shared</tspan></text></g><g data-node="cli"><rect class="box tool" x="860" y="120" width="380" height="94" rx="12"/><text x="1050" y="151" class="title" text-anchor="middle"><tspan x="1050" dy="0">fulgurjs CLI</tspan></text><text x="1050" y="179" class="body" text-anchor="middle"><tspan x="1050" dy="0">create / init / explain / types</tspan><tspan x="1050" dy="23">check-pages / doctor / port</tspan></text></g><g data-node="plugin"><rect class="box tool" x="280" y="260" width="720" height="94" rx="12"/><text x="640" y="291" class="title" text-anchor="middle"><tspan x="640" dy="0">各工程自己的 Vite 插件实例</tspan></text><text x="640" y="319" class="body" text-anchor="middle"><tspan x="640" dy="0">federation(options) · transform / virtual / shared facade</tspan></text></g><g data-node="serve"><rect class="box tool" x="40" y="390" width="390" height="100" rx="12"/><text x="235" y="421" class="title" text-anchor="middle"><tspan x="235" dy="0">serve：开发端点</tspan></text><text x="235" y="449" class="body" text-anchor="middle"><tspan x="235" dy="0">@fulgurjs-entry.js / manifest / types</tspan></text></g><g data-node="build"><rect class="box tool" x="450" y="390" width="390" height="100" rx="12"/><text x="645" y="421" class="title" text-anchor="middle"><tspan x="645" dy="0">build：Rollup / Rolldown</tspan></text><text x="645" y="449" class="body" text-anchor="middle"><tspan x="645" dy="0">remoteEntry / chunks / CSS</tspan></text></g><g data-node="dts"><rect class="box tool" x="860" y="390" width="380" height="100" rx="12"/><text x="1050" y="421" class="title" text-anchor="middle"><tspan x="1050" dy="0">声明生成与同步（可关闭）</tspan></text><text x="1050" y="449" class="body" text-anchor="middle"><tspan x="1050" dy="0">开发工具链，不是业务执行步骤</tspan><tspan x="1050" dy="23">manifest / dts</tspan></text></g><rect class="boundary" x="20" y="525" width="1240" height="200" rx="16"/><text x="38" y="554" class="section" text-anchor="start"><tspan x="38" dy="0">② 资源服务：开发服务器或生产 HTTP 静态托管</tspan></text><g data-node="files"><rect class="box resource" x="40" y="575" width="570" height="115" rx="12"/><text x="325" y="606" class="title" text-anchor="middle"><tspan x="325" dy="0">各工程独立产物</tspan></text><text x="325" y="634" class="body" text-anchor="middle"><tspan x="325" dy="0">宿主 HTML/chunks；远程入口、模块、CSS</tspan><tspan x="325" dy="23">manifest / dts 默认开启，可关闭</tspan></text></g><g data-node="http"><rect class="box resource" x="670" y="575" width="570" height="115" rx="12"/><text x="955" y="606" class="title" text-anchor="middle"><tspan x="955" dy="0">Vite dev server / HTTP / CDN</tspan></text><text x="955" y="634" class="body" text-anchor="middle"><tspan x="955" dy="0">生产缓存、CORS、SPA 回退由部署负责</tspan><tspan x="955" dy="23">远程代码最终在消费方浏览器执行</tspan></text></g><rect class="boundary" x="20" y="760" width="1240" height="730" rx="16"/><text x="38" y="789" class="section" text-anchor="start"><tspan x="38" dy="0">③ 浏览器执行：同一 realm；三条接入路径并列</tspan></text><g data-node="runtime"><rect class="box run" x="40" y="825" width="390" height="115" rx="12"/><text x="235" y="856" class="title" text-anchor="middle"><tspan x="235" dy="0">页面级运行时单例</tspan></text><text x="235" y="884" class="body" text-anchor="middle"><tspan x="235" dy="0">globalThis.__FULGURJS_RUNTIME__</tspan><tspan x="235" dy="23">共享注册表 / shareScope × shareKey</tspan></text></g><g data-node="load"><rect class="box run" x="450" y="825" width="390" height="115" rx="12"/><text x="645" y="856" class="title" text-anchor="middle"><tspan x="645" dy="0">远程加载与初始化</tspan></text><text x="645" y="884" class="body" text-anchor="middle"><tspan x="645" dy="0">loadRemote · init · setup / onSession</tspan><tspan x="645" dy="23">详见模块加载顺序图</tspan></text></g><g data-node="context"><rect class="box run" x="860" y="825" width="380" height="115" rx="12"/><text x="1050" y="856" class="title" text-anchor="middle"><tspan x="1050" dy="0">AppContext</tspan></text><text x="1050" y="884" class="body" text-anchor="middle"><tspan x="1050" dy="0">页面级快照 + 函数引用</tspan><tspan x="1050" dy="23">不是自动响应式跨框架总线</tspan></text></g><g data-node="components"><rect class="box run" x="40" y="1020" width="390" height="140" rx="12"/><text x="235" y="1051" class="title" text-anchor="middle"><tspan x="235" dy="0">路径 1：组件 / 普通模块</tspan></text><text x="235" y="1079" class="body" text-anchor="middle"><tspan x="235" dy="0">remoteComponent / loadRemote</tspan><tspan x="235" dy="23">useLoadRemote (React)</tspan><tspan x="235" dy="23">不需要页面表或完整应用桥接</tspan></text></g><g data-node="pages"><rect class="box run" x="450" y="1020" width="390" height="140" rx="12"/><text x="645" y="1051" class="title" text-anchor="middle"><tspan x="645" dy="0">路径 2：逐页接入</tspan></text><text x="645" y="1079" class="body" text-anchor="middle"><tspan x="645" dy="0">definePages / createHostPages</tspan><tspan x="645" dy="23">createReactHostPages</tspan><tspan x="645" dy="23">宿主管理页面表、菜单与路由</tspan></text></g><g data-node="bridge"><rect class="box run" x="860" y="1020" width="380" height="140" rx="12"/><text x="1050" y="1051" class="title" text-anchor="middle"><tspan x="1050" dy="0">路径 3：完整应用桥接</tspan></text><text x="1050" y="1079" class="body" text-anchor="middle"><tspan x="1050" dy="0">createVueBridgeApp</tspan><tspan x="1050" dy="23">createReactBridgeApp</tspan><tspan x="1050" dy="23">子应用保留路由、状态与生命周期</tspan></text></g><g data-node="preload"><rect class="box run" x="40" y="1260" width="390" height="140" rx="12"/><text x="235" y="1291" class="title" text-anchor="middle"><tspan x="235" dy="0">资源预载：可选旁路</tspan></text><text x="235" y="1319" class="body" text-anchor="middle"><tspan x="235" dy="0">preloadRemote</tspan><tspan x="235" dy="23">不执行业务模块或 setup/onSession</tspan><tspan x="235" dy="23">stylesheet 仍可影响全局样式</tspan></text></g><g data-node="environment"><rect class="box run" x="450" y="1260" width="390" height="140" rx="12"/><text x="645" y="1291" class="title" text-anchor="middle"><tspan x="645" dy="0">组件环境与业务状态</tspan></text><text x="645" y="1319" class="body" text-anchor="middle"><tspan x="645" dy="0">globalComponents / pageProviders</tspan><tspan x="645" dy="23">按实际消费方 app / 渲染应用</tspan><tspan x="645" dy="23">Pinia 库共享 ≠ 业务 store 自动共享</tspan></text></g><g data-node="contract"><rect class="box run" x="860" y="1260" width="380" height="140" rx="12"/><text x="1050" y="1291" class="title" text-anchor="middle"><tspan x="1050" dy="0">契约可复用；挂载实例按 DOM 容器</tspan></text><text x="1050" y="1319" class="body" text-anchor="middle"><tspan x="1050" dy="0">defineApplication / defineBridgeApp</tspan><tspan x="1050" dy="23">每次 mount 内调用业务工厂</tspan><tspan x="1050" dy="23">session / URL 同步按需开启</tspan></text></g><text x="40" y="1470" class="body" text-anchor="start"><tspan x="40" dy="0">实线：调用/依赖/请求；虚线：生成、部署或可选旁路。资源返回沿请求反向，图中省略返回箭头。</tspan></text><text x="40" y="1530" class="body" text-anchor="start"><tspan x="40" dy="0">框架组件不做类型互转；跨 Vue/React UI 使用完整应用桥接。</tspan></text><text x="1125" y="365" class="edge-label" text-anchor="middle"><tspan x="1125" dy="0">生成 / 同步</tspan></text><text x="640" y="617" class="edge-label" text-anchor="middle"><tspan x="640" dy="0">服务资源</tspan></text><text x="1070" y="502" class="edge-label" text-anchor="middle"><tspan x="1070" dy="0">开发端点</tspan></text><text x="1080" y="778" class="edge-label" text-anchor="middle"><tspan x="1080" dy="0">请求入口与资源</tspan></text><text x="440" y="810" class="edge-label" text-anchor="middle"><tspan x="440" dy="0">调用内核能力</tspan></text><text x="850" y="870" class="edge-label" text-anchor="middle"><tspan x="850" dy="0">读取</tspan></text><text x="365" y="968" class="edge-label" text-anchor="middle"><tspan x="365" dy="0">loadRemote</tspan></text><text x="705" y="985" class="edge-label" text-anchor="middle"><tspan x="705" dy="0">loadRemote</tspan></text><text x="1090" y="978" class="edge-label" text-anchor="middle"><tspan x="1090" dy="0">loadRemote</tspan></text><text x="665" y="1215" class="edge-label" text-anchor="middle"><tspan x="665" dy="0">组件消费方环境（按需）</tspan></text><text x="1140" y="1210" class="edge-label" text-anchor="middle"><tspan x="1140" dy="0">mount / unmount</tspan></text><text x="150" y="1218" class="edge-label" text-anchor="middle"><tspan x="150" dy="0">仅资源提示</tspan></text></svg>
