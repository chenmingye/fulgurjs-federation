">remoteEntry → container.init(shareScopeMap)</tspan><tspan x="320" dy="23">共享准备由生成的接线与容器完成</tspan></text></g><g data-node="resources"><rect class="box run" x="680" y="285" width="560" height="120" rx="12"/><text x="960" y="316" class="title" text-anchor="middle"><tspan x="960" dy="0">并行准备资源（存在清单时）</tspan></text><text x="960" y="344" class="body" text-anchor="middle"><tspan x="960" dy="0">preloadRemote(spec)</tspan><tspan x="960" dy="23">JS 资源提示 + CSS 等待，不执行业务模块</tspan></text></g><g data-node="setup"><rect class="box run" x="290" y="490" width="700" height="120" rx="12"/><text x="640" y="521" class="title" text-anchor="middle"><tspan x="640" dy="0">读取 setup 声明；执行可选 default 函数</tspan></text><text x="640" y="549" class="body" text-anchor="middle"><tspan x="640" dy="0">每个远程容器成功执行一次，失败可重试</tspan><tspan x="640" dy="23">这里的容器不是 DOM 挂载容器</tspan></text></g><g data-node="declared"><rect class="box run" x="440" y="690" width="400" height="100" rx="12"/><text x="640" y="721" class="title" text-anchor="middle"><tspan x="640" dy="0">是否声明 onSession？</tspan></text><text x="640" y="749" class="body" text-anchor="middle"><tspan x="640" dy="0">无初始化模块时也跳过该段</tspan></text></g><g data-node="skip"><rect class="box note" x="40" y="860" width="340" height="100" rx="12"/><text x="210" y="891" class="title" text-anchor="middle"><tspan x="210" dy="0">无需会话钩子</tspan></text><text x="210" y="919" class="body" text-anchor="middle"><tspan x="210" dy="0">继续模块加载</tspan></text></g><g data-node="valid"><rect class="box run" x="460" y="860" width="360" height="100" rx="12"/><text x="640" y="891" class="title" text-anchor="middle"><tspan x="640" dy="0">sessionKey 是否有效？</tspan></text><text x="640" y="919" class="body" text-anchor="middle"><tspan x="640" dy="0">必须是非空字符串</tspan></text></g><g data-node="missing"><rect class="box error" x="900" y="860" width="340" height="130" rx="12"/><text x="1070" y="891" class="title" text-anchor="middle"><tspan x="1070" dy="0">MFU-013</tspan></text><text x="1070" y="919" class="body" text-anchor="middle"><tspan x="1070" dy="0">声明了钩子却缺有效代次</tspan><tspan x="1070" dy="23">本次加载失败，不继续返回模块</tspan></text></g><g data-node="dedup"><rect class="box run" x="460" y="1050" width="360" height="115" rx="12"/><text x="640" y="1081" class="title" text-anchor="middle"><tspan x="640" dy="0">同代次已有成功/进行中记录？</tspan></text><text x="640" y="1109" class="body" text-anchor="middle"><tspan x="640" dy="0">已成功：复用；进行中：等待</tspan></text></g><g data-node="reuse"><rect class="box note" x="40" y="1050" width="340" height="115" rx="12"/><text x="210" y="1081" class="title" text-anchor="middle"><tspan x="210" dy="0">不重复执行 onSession</tspan></text><text x="210" y="1109" class="body" text-anchor="middle"><tspan x="210" dy="0">复用同一代次的 Promise</tspan></text></g><g data-node="session"><rect class="box run" x="460" y="1250" width="360" height="130" rx="12"/><text x="640" y="1281" class="title" text-anchor="middle"><tspan x="640" dy="0">执行本代次 onSession</tspan></text><text x="640" y="1309" class="body" text-anchor="middle"><tspan x="640" dy="0">新代次作废旧信号并串行衔接</tspan><tspan x="640" dy="23">异步写业务状态前检查 signal</tspan></text></g><g data-node="environment"><rect class="box run" x="290" y="1465" width="700" height="120" rx="12"/><text x="640" y="1496" class="title" text-anchor="middle"><tspan x="640" dy="0">安装/交付消费方所需环境声明</tspan></text><text x="640" y="1524" class="body" text-anchor="middle"><tspan x="640" dy="0">Vue 全局组件注册；向适配器交付 pageProviders</tspan><tspan x="640" dy="23">手动 loadRemote 不自动提供组件树包装</tspan></text></g><g data-node="get"><rect class="box run" x="290" y="1665" width="700" height="120" rx="12"/><text x="640" y="1696" class="title" text-anchor="middle"><tspan x="640" dy="0">取得 expose 模块：缓存命中则复用</tspan></text><text x="640" y="1724" class="body" text-anchor="middle"><tspan x="640" dy="0">container.get(&apos;./expose&apos;)</tspan><tspan x="640" dy="23">缓存命中仍经过前面的会话检查</tspan></text></g><g data-node="render"><rect class="box run" x="290" y="1865" width="700" height="120" rx="12"/><text x="640" y="1896" class="title" text-anchor="middle"><tspan x="640" dy="0">返回模块；组件适配器再包装与渲染</tspan></text><text x="640" y="1924" class="body" text-anchor="middle"><tspan x="640" dy="0">remoteComponent 应用所需 Provider 并渲染</tspan><tspan x="640" dy="23">普通 loadRemote 返回命名空间，由业务使用</tspan></text></g><text x="40" y="2065" class="body" text-anchor="start"><tspan x="40" dy="0">说明：仅 loadRemote(&quot;remote&quot;) 只取得容器，不执行 setup/onSession；上述流程针对完整模块 spec。</tspan><tspan x="40" dy="23">预载不是初始化；同会话缓存访问不重复下载已成功模块，也不重复执行已成功的 onSession。</tspan><tspan x="40" dy="23">虚线表示可选/跳过路径；异常分支终止本次尝试，恢复取决于具体错误。</tspan></text><text x="300" y="725" class="edge-label" text-anchor="middle"><tspan x="300" dy="0">未声明</tspan></text><text x="690" y="827" class="edge-label" text-anchor="middle"><tspan x="690" dy="0">已声明</tspan></text><text x="860" y="894" class="edge-label" text-anchor="middle"><tspan x="860" dy="0">无效</tspan></text><text x="685" y="1010" class="edge-label" text-anchor="middle"><tspan x="685" dy="0">有效</tspan></text><text x="420" y="1090" class="edge-label" text-anchor="middle"><tspan x="420" dy="0">是</tspan></text><text x="825" y="1212" class="edge-label" text-anchor="middle"><tspan x="825" dy="0">新代次 / 失败后重试</tspan></text><text x="850" y="1420" class="edge-label" text-anchor="middle"><tspan x="850" dy="0">成功；失败则拒绝本次加载</tspan></text></svg>

ate"><rect class="box run" x="340" y="1155" width="600" height="110" rx="12"/><text x="640" y="1186" class="title" text-anchor="middle"><tspan x="640" dy="0">作废旧挂载代次，停止旧信号与路由通道</tspan></text><text x="640" y="1214" class="body" text-anchor="middle"><tspan x="640" dy="0">迟到结果丢弃；业务异步写入仍需自身检查</tspan></text></g><g data-node="unmount"><rect class="box run" x="340" y="1335" width="600" height="100" rx="12"/><text x="640" y="1366" class="title" text-anchor="middle"><tspan x="640" dy="0">contract.unmount(el)</tspan></text><text x="640" y="1394" class="body" text-anchor="middle"><tspan x="640" dy="0">实际释放本实例 root、router、订阅和业务资源</tspan></text></g><g data-node="blocked"><rect class="box error" x="980" y="1495" width="260" height="130" rx="12"/><text x="1110" y="1526" class="title" text-anchor="middle"><tspan x="1110" dy="0">封锁该 DOM 容器</tspan></text><text x="1110" y="1554" class="body" text-anchor="middle"><tspan x="1110" dy="0">不继续重挂</tspan><tspan x="1110" dy="23">修复后整页刷新恢复</tspan></text></g><g data-node="decision"><rect class="box run" x="340" y="1505" width="600" height="110" rx="12"/><text x="640" y="1536" class="title" text-anchor="middle"><tspan x="640" dy="0">卸载成功：仍需挂载且有有效新代次？</tspan></text><text x="640" y="1564" class="body" text-anchor="middle"><tspan x="640" dy="0">区分登出/离页与登录新代次</tspan></text></g><g data-node="stopped"><rect class="box note" x="80" y="1705" width="470" height="100" rx="12"/><text x="315" y="1736" class="title" text-anchor="middle"><tspan x="315" dy="0">保持空容器，不再加载或自动重挂</tspan></text><text x="315" y="1764" class="body" text-anchor="middle"><tspan x="315" dy="0">登出 sessionKey=null / 宿主不再显示该应用</tspan></text></g><g data-node="new"><rect class="box run" x="650" y="1705" width="470" height="100" rx="12"/><text x="885" y="1736" class="title" text-anchor="middle"><tspan x="885" dy="0">新代次：重新加载/校验并调用 mount</tspan></text><text x="885" y="1764" class="body" text-anchor="middle"><tspan x="885" dy="0">成功模块复用；工厂为新实例重新执行</tspan></text></g><text x="40" y="1865" class="body" text-anchor="start"><tspan x="40" dy="0">契约模块可以复用；每次 mount 的实例按 DOM 容器与代次区分。异步失败不能让旧实例复活。</tspan></text><text x="715" y="946" class="edge-label" text-anchor="middle"><tspan x="715" dy="0">运行中</tspan></text><text x="210" y="1140" class="edge-label" text-anchor="middle"><tspan x="210" dy="0">初始化途中离开 / 取消</tspan></text><text x="1080" y="1447" class="edge-label" text-anchor="middle"><tspan x="1080" dy="0">卸载抛错</tspan></text><text x="725" y="1475" class="edge-label" text-anchor="middle"><tspan x="725" dy="0">卸载成功</tspan></text><text x="320" y="1647" class="edge-label" text-anchor="middle"><tspan x="320" dy="0">否：登出 / 离页</tspan></text><text x="875" y="1647" class="edge-label" text-anchor="middle"><tspan x="875" dy="0">是：有效代次</tspan></text><text x="1095" y="456" class="edge-label" text-anchor="middle"><tspan x="1095" dy="0">清理成功后才允许新挂载</tspan></text></svg>
