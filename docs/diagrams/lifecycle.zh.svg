<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1280 1915" width="1280" height="1915" role="img" lang="zh-CN" aria-labelledby="title description"><title id="title">完整应用生命周期：先 mount，再执行工厂</title><desc id="description">登出不重挂；换代先实际卸载；卸载失败封锁 DOM 容器。</desc><style>:root{--bg:#fff;--text:#172b43;--muted:#465c72;--line:#526b85;--tool:#e8f5ef;--run:#e6f5fc;--resource:#fff3df;--note:#f1f4f8;--error:#fff0f1;--error-line:#b91c36;--border:#c1ccd8} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}} :root[data-theme="dark"]{--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}
.diagram{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text)}
.diagram .background{fill:var(--bg)}.diagram text{fill:var(--text)}
.diagram .heading{font-size:25px;font-weight:700}.diagram .section{font-size:18px;font-weight:700}
.diagram .title{font-size:18px;font-weight:700}.diagram .body{font-size:15px;fill:var(--muted)}
.diagram .edge-label{font-size:14px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.diagram .box{stroke:var(--border);stroke-width:1.5;fill:var(--note)}
.diagram .tool{fill:var(--tool)}.diagram .run{fill:var(--run)}.diagram .resource{fill:var(--resource)}
.diagram .error{fill:var(--error);stroke:var(--error-line)}
.diagram .boundary{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:7 5}
.diagram .edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}
.diagram .optional{stroke-dasharray:7 5}.diagram .failure{stroke:var(--error-line);marker-end:url(#error-arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--line)"/></marker><marker id="error-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--error-line)"/></marker></defs><rect class="background" width="1280" height="1915"/><text class="heading" x="30" y="40">完整应用生命周期：先 mount，再执行工厂</text><path class="edge " d="M 460 190 L 460 225 L 320 225 L 320 260"/><path class="edge " d="M 820 190 L 820 225 L 960 225 L 960 260"/><path class="edge " d="M 320 370 L 320 400 L 540 400 L 540 435"/><path class="edge " d="M 960 370 L 960 400 L 740 400 L 740 435"/><path class="edge " d="M 640 545 L 640 615"/><path class="edge " d="M 640 725 L 640 795"/><path class="edge " d="M 640 905 L 640 975"/><path class="edge " d="M 640 1085 L 640 1155"/><path class="edge optional" d="M 340 670 L 80 670 L 80 1210 L 340 1210"/><path class="edge " d="M 640 1265 L 640 1335"/><path class="edge failure" d="M 940 1385 L 960 1385 L 960 1540 L 980 1540"/><path class="edge " d="M 640 1435 L 640 1505"/><path class="edge " d="M 460 1615 L 460 1660 L 315 1660 L 315 1705"/><path class="edge " d="M 820 1615 L 820 1660 L 885 1660 L 885 1705"/><path class="edge " d="M 1120 1755 L 1260 1755 L 1260 490 L 940 490"/><g data-node="definition"><rect class="box run" x="290" y="90" width="700" height="100" rx="12"/><text x="640" y="121" class="title" text-anchor="middle"><tspan x="640" dy="0">定义并导出应用契约（尚未执行业务工厂）</tspan></text><text x="640" y="149" class="body" text-anchor="middle"><tspan x="640" dy="0">defineApplication(factory) / defineBridgeApp(factory)</tspan></text></g><g data-node="bridge"><rect class="box run" x="40" y="260" width="560" height="110" rx="12"/><text x="320" y="291" class="title" text-anchor="middle"><tspan x="320" dy="0">嵌入运行：宿主加载契约</tspan></text><text x="320" y="319" class="body" text-anchor="middle"><tspan x="320" dy="0">createVueBridgeApp / createReactBridgeApp</tspan><tspan x="320" dy="23">宿主调用 contract.mount(el)</tspan></text></g><g data-node="standalone"><rect class="box run" x="680" y="260" width="560" height="110" rx="12"/><text x="960" y="291" class="title" text-anchor="middle"><tspan x="960" dy="0">独立运行：统一装配入口</tspan></text><text x="960" y="319" class="body" text-anchor="middle"><tspan x="960" dy="0">defineApplication → application.start(target, props)</tspan><tspan x="960" dy="23">内部调用独立模式对应的 mount</tspan></text></g><g data-node="mount"><rect class="box run" x="340" y="435" width="600" height="110" rx="12"/><text x="640" y="466" class="title" text-anchor="middle"><tspan x="640" dy="0">mount：检查占用并登记本次 DOM 容器代次</tspan></text><text x="640" y="494" class="body" text-anchor="middle"><tspan x="640" dy="0">建立 signal、props 快照和实例记录</tspan></text></g><g data-node="factory"><rect class="box run" x="340" y="615" width="600" height="110" rx="12"/><text x="640" y="646" class="title" text-anchor="middle"><tspan x="640" dy="0">在 mount 内执行本次业务工厂</tspan></text><text x="640" y="674" class="body" text-anchor="middle"><tspan x="640" dy="0">业务创建 app/root、router、store 与插件</tspan><tspan x="640" dy="23">需要时等待路由准备；异步阶段遵守 signal</tspan></text></g><g data-node="commit"><rect class="box run" x="340" y="795" width="600" height="110" rx="12"/><text x="640" y="826" class="title" text-anchor="middle"><tspan x="640" dy="0">首次根提交完成 → 挂载 Promise 成功</tspan></text><text x="640" y="854" class="body" text-anchor="middle"><tspan x="640" dy="0">Vue 根挂载 / React 提交探针</tspan><tspan x="640" dy="23">不代表全部接口、权限及业务异步已完成</tspan></text></g><g data-node="event"><rect class="box run" x="340" y="975" width="600" height="110" rx="12"/><text x="640" y="1006" class="title" text-anchor="middle"><tspan x="640" dy="0">受控会话变化，或主动卸载</tspan></text><text x="640" y="1034" class="body" text-anchor="middle"><tspan x="640" dy="0">同身份 token 轮换、普通 appProps 替换不触发重挂</tspan></text></g><g data-node="invalidate"><rect class="box run" x="340" y="1155" width="600" height="110" rx="12"/><text x="640" y="1186" class="title" text-anchor="middle"><tspan x="640" dy="0">作废旧挂载代次，停止旧信号与路由通道</tspan></text><text x="640" y="1214" class="body" text-anchor="middle"><tspan x="640" dy="0">迟到结果丢弃；业务异步写入仍需自身检查</tspan></text></g><g data-node="unmount"><rect class="box run" x="340" y="1335" width="600" height="100" rx="12"/><text x="640" y="1366" class="title" text-anchor="middle"><tspan x="640" dy="0">contract.unmount(el)</tspan></text><text x="640" y="1394" class="body" text-anchor="middle"><tspan x="640" dy="0">实际释放本实例 root、router、订阅和业务资源</tspan></text></g><g data-node="blocked"><rect class="box error" x="980" y="1495" width="260" height="130" rx="12"/><text x="1110" y="1526" class="title" text-anchor="middle"><tspan x="1110" dy="0">封锁该 DOM 容器</tspan></text><text x="1110" y="1554" class="body" text-anchor="middle"><tspan x="1110" dy="0">不继续重挂</tspan><tspan x="1110" dy="23">修复后整页刷新恢复</tspan></text></g><g data-node="decision"><rect class="box run" x="340" y="1505" width="600" height="110" rx="12"/><text x="640" y="1536" class="title" text-anchor="middle"><tspan x="640" dy="0">卸载成功：仍需挂载且有有效新代次？</tspan></text><text x="640" y="1564" class="body" text-anchor="middle"><tspan x="640" dy="0">区分登出/离页与登录新代次</tspan></text></g><g data-node="stopped"><rect class="box note" x="80" y="1705" width="470" height="100" rx="12"/><text x="315" y="1736" class="title" text-anchor="middle"><tspan x="315" dy="0">保持空容器，不再加载或自动重挂</tspan></text><text x="315" y="1764" class="body" text-anchor="middle"><tspan x="315" dy="0">登出 sessionKey=null / 宿主不再显示该应用</tspan></text></g><g data-node="new"><rect class="box run" x="650" y="1705" width="470" height="100" rx="12"/><text x="885" y="1736" class="title" text-anchor="middle"><tspan x="885" dy="0">新代次：重新加载/校验并调用 mount</tspan></text><text x="885" y="1764" class="body" text-anchor="middle"><tspan x="885" dy="0">成功模块复用；工厂为新实例重新执行</tspan></text></g><text x="40" y="1865" class="body" text-anchor="start"><tspan x="40" dy="0">契约模块可以复用；每次 mount 的实例按 DOM 容器与代次区分。异步失败不能让旧实例复活。</tspan></text><text x="715" y="946" class="edge-label" text-anchor="middle"><tspan x="715" dy="0">运行中</tspan></text><text x="210" y="1140" class="edge-label" text-anchor="middle"><tspan x="210" dy="0">初始化途中离开 / 取消</tspan></text><text x="1080" y="1447" class="edge-label" text-anchor="middle"><tspan x="1080" dy="0">卸载抛错</tspan></text><text x="725" y="1475" class="edge-label" text-anchor="middle"><tspan x="725" dy="0">卸载成功</tspan></text><text x="320" y="1647" class="edge-label" text-anchor="middle"><tspan x="320" dy="0">否：登出 / 离页</tspan></text><text x="875" y="1647" class="edge-label" text-anchor="middle"><tspan x="875" dy="0">是：有效代次</tspan></text><text x="1095" y="456" class="edge-label" text-anchor="middle"><tspan x="1095" dy="0">清理成功后才允许新挂载</tspan></text></svg>
