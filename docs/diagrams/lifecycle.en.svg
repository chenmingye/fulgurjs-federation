<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1280 1915" width="1280" height="1915" role="img" lang="en" aria-labelledby="title description"><title id="title">Full-app lifecycle: mount invokes the factory</title><desc id="description">Logout does not remount. Generation changes first unmount; cleanup failures lock the DOM container.</desc><style>:root{--bg:#fff;--text:#172b43;--muted:#465c72;--line:#526b85;--tool:#e8f5ef;--run:#e6f5fc;--resource:#fff3df;--note:#f1f4f8;--error:#fff0f1;--error-line:#b91c36;--border:#c1ccd8} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}} :root[data-theme="dark"]{--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}
.diagram{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text)}
.diagram .background{fill:var(--bg)}.diagram text{fill:var(--text)}
.diagram .heading{font-size:25px;font-weight:700}.diagram .section{font-size:18px;font-weight:700}
.diagram .title{font-size:18px;font-weight:700}.diagram .body{font-size:15px;fill:var(--muted)}
.diagram .edge-label{font-size:14px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.diagram .box{stroke:var(--border);stroke-width:1.5;fill:var(--note)}
.diagram .tool{fill:var(--tool)}.diagram .run{fill:var(--run)}.diagram .resource{fill:var(--resource)}
.diagram .error{fill:var(--error);stroke:var(--error-line)}
.diagram .boundary{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:7 5}
.diagram .edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}
.diagram .optional{stroke-dasharray:7 5}.diagram .failure{stroke:var(--error-line);marker-end:url(#error-arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--line)"/></marker><marker id="error-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--error-line)"/></marker></defs><rect class="background" width="1280" height="1915"/><text class="heading" x="30" y="40">Full-app lifecycle: mount invokes the factory</text><path class="edge " d="M 460 190 L 460 225 L 320 225 L 320 260"/><path class="edge " d="M 820 190 L 820 225 L 960 225 L 960 260"/><path class="edge " d="M 320 370 L 320 400 L 540 400 L 540 435"/><path class="edge " d="M 960 370 L 960 400 L 740 400 L 740 435"/><path class="edge " d="M 640 545 L 640 615"/><path class="edge " d="M 640 725 L 640 795"/><path class="edge " d="M 640 905 L 640 975"/><path class="edge " d="M 640 1085 L 640 1155"/><path class="edge optional" d="M 340 670 L 80 670 L 80 1210 L 340 1210"/><path class="edge " d="M 640 1265 L 640 1335"/><path class="edge failure" d="M 940 1385 L 960 1385 L 960 1540 L 980 1540"/><path class="edge " d="M 640 1435 L 640 1505"/><path class="edge " d="M 460 1615 L 460 1660 L 315 1660 L 315 1705"/><path class="edge " d="M 820 1615 L 820 1660 L 885 1660 L 885 1705"/><path class="edge " d="M 1120 1755 L 1260 1755 L 1260 490 L 940 490"/><g data-node="definition"><rect class="box run" x="290" y="90" width="700" height="100" rx="12"/><text x="640" y="121" class="title" text-anchor="middle"><tspan x="640" dy="0">Define/export contract (business factory not yet called)</tspan></text><text x="640" y="149" class="body" text-anchor="middle"><tspan x="640" dy="0">defineApplication(factory) / defineBridgeApp(factory)</tspan></text></g><g data-node="bridge"><rect class="box run" x="40" y="260" width="560" height="110" rx="12"/><text x="320" y="291" class="title" text-anchor="middle"><tspan x="320" dy="0">Embedded: host loads the contract</tspan></text><text x="320" y="319" class="body" text-anchor="middle"><tspan x="320" dy="0">createVueBridgeApp / createReactBridgeApp</tspan><tspan x="320" dy="23">Host calls contract.mount(el)</tspan></text></g><g data-node="standalone"><rect class="box run" x="680" y="260" width="560" height="110" rx="12"/><text x="960" y="291" class="title" text-anchor="middle"><tspan x="960" dy="0">Standalone: unified application entry</tspan></text><text x="960" y="319" class="body" text-anchor="middle"><tspan x="960" dy="0">defineApplication → application.start(target, props)</tspan><tspan x="960" dy="23">Internally calls the standalone-mode mount</tspan></text></g><g data-node="mount"><rect class="box run" x="340" y="435" width="600" height="110" rx="12"/><text x="640" y="466" class="title" text-anchor="middle"><tspan x="640" dy="0">mount: validate occupancy; register DOM generation</tspan></text><text x="640" y="494" class="body" text-anchor="middle"><tspan x="640" dy="0">Create signal, props snapshot and instance record</tspan></text></g><g data-node="factory"><rect class="box run" x="340" y="615" width="600" height="110" rx="12"/><text x="640" y="646" class="title" text-anchor="middle"><tspan x="640" dy="0">Invoke this business factory inside mount</tspan></text><text x="640" y="674" class="body" text-anchor="middle"><tspan x="640" dy="0">Business creates app/root, router, stores, plugins</tspan><tspan x="640" dy="23">Await routing when needed; async work observes signal</tspan></text></g><g data-node="commit"><rect class="box run" x="340" y="795" width="600" height="110" rx="12"/><text x="640" y="826" class="title" text-anchor="middle"><tspan x="640" dy="0">First root commit → successful mount Promise</tspan></text><text x="640" y="854" class="body" text-anchor="middle"><tspan x="640" dy="0">Vue root mount / React commit probe</tspan><tspan x="640" dy="23">Not proof of all API/auth/business async completion</tspan></text></g><g data-node="event"><rect class="box run" x="340" y="975" width="600" height="110" rx="12"/><text x="640" y="1006" class="title" text-anchor="middle"><tspan x="640" dy="0">Controlled session change or explicit unmount</tspan></text><text x="640" y="1034" class="body" text-anchor="middle"><tspan x="640" dy="0">Token rotation / normal appProps replacement does not remount</tspan></text></g><g data-node="invalidate"><rect class="box run" x="340" y="1155" width="600" height="110" rx="12"/><text x="640" y="1186" class="title" text-anchor="middle"><tspan x="640" dy="0">Invalidate old mount generation, signal and routing</tspan></text><text x="640" y="1214" class="body" text-anchor="middle"><tspan x="640" dy="0">Discard late results; business async writes must also guard</tspan></text></g><g data-node="unmount"><rect class="box run" x="340" y="1335" width="600" height="100" rx="12"/><text x="640" y="1366" class="title" text-anchor="middle"><tspan x="640" dy="0">contract.unmount(el)</tspan></text><text x="640" y="1394" class="body" text-anchor="middle"><tspan x="640" dy="0">Actually release this root, router, subscriptions and owned resources</tspan></text></g><g data-node="blocked"><rect class="box error" x="980" y="1495" width="260" height="130" rx="12"/><text x="1110" y="1526" class="title" text-anchor="middle"><tspan x="1110" dy="0">Lock this DOM container</tspan></text><text x="1110" y="1554" class="body" text-anchor="middle"><tspan x="1110" dy="0">Do not remount</tspan><tspan x="1110" dy="23">Fix, then refresh page</tspan></text></g><g data-node="decision"><rect class="box run" x="340" y="1505" width="600" height="110" rx="12"/><text x="640" y="1536" class="title" text-anchor="middle"><tspan x="640" dy="0">Cleanup succeeded: mount needed and valid generation?</tspan></text><text x="640" y="1564" class="body" text-anchor="middle"><tspan x="640" dy="0">Distinguish logout/removal from a new login generation</tspan></text></g><g data-node="stopped"><rect class="box note" x="80" y="1705" width="470" height="100" rx="12"/><text x="315" y="1736" class="title" text-anchor="middle"><tspan x="315" dy="0">Remain empty; no loading or automatic remount</tspan></text><text x="315" y="1764" class="body" text-anchor="middle"><tspan x="315" dy="0">sessionKey=null / host no longer shows this app</tspan></text></g><g data-node="new"><rect class="box run" x="650" y="1705" width="470" height="100" rx="12"/><text x="885" y="1736" class="title" text-anchor="middle"><tspan x="885" dy="0">New generation: load/validate and call mount</tspan></text><text x="885" y="1764" class="body" text-anchor="middle"><tspan x="885" dy="0">Reuse successful modules; rerun factory for new instance</tspan></text></g><text x="40" y="1865" class="body" text-anchor="start"><tspan x="40" dy="0">Contract modules can be reused; mount instances are keyed by DOM container and generation. Late failures cannot revive old instances.</tspan></text><text x="715" y="946" class="edge-label" text-anchor="middle"><tspan x="715" dy="0">running</tspan></text><text x="210" y="1140" class="edge-label" text-anchor="middle"><tspan x="210" dy="0">leave / cancel while initializing</tspan></text><text x="1080" y="1447" class="edge-label" text-anchor="middle"><tspan x="1080" dy="0">unmount throws</tspan></text><text x="725" y="1475" class="edge-label" text-anchor="middle"><tspan x="725" dy="0">cleanup succeeded</tspan></text><text x="320" y="1647" class="edge-label" text-anchor="middle"><tspan x="320" dy="0">no: logout / removal</tspan></text><text x="875" y="1647" class="edge-label" text-anchor="middle"><tspan x="875" dy="0">yes: valid generation</tspan></text><text x="1095" y="456" class="edge-label" text-anchor="middle"><tspan x="1095" dy="0">remount only after successful cleanup</tspan></text></svg>
