<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1280 2210" width="1280" height="2210" role="img" lang="en" aria-labelledby="title description"><title id="title">Module loading: initialization, sessions and cache</title><desc id="description">Declaring onSession without sessionKey fails; successful same-generation initialization is not repeated.</desc><style>:root{--bg:#fff;--text:#172b43;--muted:#465c72;--line:#526b85;--tool:#e8f5ef;--run:#e6f5fc;--resource:#fff3df;--note:#f1f4f8;--error:#fff0f1;--error-line:#b91c36;--border:#c1ccd8} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}} :root[data-theme="dark"]{--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}
.diagram{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text)}
.diagram .background{fill:var(--bg)}.diagram text{fill:var(--text)}
.diagram .heading{font-size:25px;font-weight:700}.diagram .section{font-size:18px;font-weight:700}
.diagram .title{font-size:18px;font-weight:700}.diagram .body{font-size:15px;fill:var(--muted)}
.diagram .edge-label{font-size:14px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.diagram .box{stroke:var(--border);stroke-width:1.5;fill:var(--note)}
.diagram .tool{fill:var(--tool)}.diagram .run{fill:var(--run)}.diagram .resource{fill:var(--resource)}
.diagram .error{fill:var(--error);stroke:var(--error-line)}
.diagram .boundary{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:7 5}
.diagram .edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}
.diagram .optional{stroke-dasharray:7 5}.diagram .failure{stroke:var(--error-line);marker-end:url(#error-arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--line)"/></marker><marker id="error-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--error-line)"/></marker></defs><rect class="background" width="1280" height="2210"/><text class="heading" x="30" y="40">Module loading: initialization, sessions and cache</text><path class="edge " d="M 460 200 L 460 240 L 320 240 L 320 285"/><path class="edge " d="M 820 200 L 820 240 L 960 240 L 960 285"/><path class="edge " d="M 320 405 L 320 450 L 540 450 L 540 490"/><path class="edge " d="M 960 405 L 960 450 L 740 450 L 740 490"/><path class="edge " d="M 640 610 L 640 690"/><path class="edge " d="M 440 740 L 210 740 L 210 860"/><path class="edge " d="M 640 790 L 640 860"/><path class="edge failure" d="M 820 910 L 900 910"/><path class="edge " d="M 640 960 L 640 1050"/><path class="edge " d="M 460 1107 L 380 1107"/><path class="edge " d="M 640 1165 L 640 1250"/><path class="edge optional" d="M 210 960 L 210 990 L 20 990 L 20 1525 L 290 1525"/><path class="edge " d="M 210 1165 L 210 1525"/><path class="edge " d="M 640 1380 L 640 1465"/><path class="edge " d="M 640 1585 L 640 1665"/><path class="edge " d="M 640 1785 L 640 1865"/><g data-node="call"><rect class="box run" x="290" y="100" width="700" height="100" rx="12"/><text x="640" y="131" class="title" text-anchor="middle"><tspan x="640" dy="0">Consumer starts actual loading</tspan></text><text x="640" y="159" class="body" text-anchor="middle"><tspan x="640" dy="0">remoteComponent / page adapter / bridge → loadRemote(full spec)</tspan></text></g><g data-node="container"><rect class="box run" x="40" y="285" width="560" height="120" rx="12"/><text x="320" y="316" class="title" text-anchor="middle"><tspan x="320" dy="0">Acquire and initialize container</tspan></text><text x="320" y="344" class="body" text-anchor="middle"><tspan x="320" dy="0">remoteEntry → container.init(shareScopeMap)</tspan><tspan x="320" dy="23">Generated wiring/container prepares sharing</tspan></text></g><g data-node="resources"><rect class="box run" x="680" y="285" width="560" height="120" rx="12"/><text x="960" y="316" class="title" text-anchor="middle"><tspan x="960" dy="0">Prepare resources in parallel (with manifest)</tspan></text><text x="960" y="344" class="body" text-anchor="middle"><tspan x="960" dy="0">preloadRemote(spec)</tspan><tspan x="960" dy="23">JS hints + stylesheet waiting; no business execution</tspan></text></g><g data-node="setup"><rect class="box run" x="290" y="490" width="700" height="120" rx="12"/><text x="640" y="521" class="title" text-anchor="middle"><tspan x="640" dy="0">Read setup declarations; run optional default</tspan></text><text x="640" y="549" class="body" text-anchor="middle"><tspan x="640" dy="0">Once per successful remote-container setup; failures can retry</tspan><tspan x="640" dy="23">Remote container, not a DOM mount element</tspan></text></g><g data-node="declared"><rect class="box run" x="440" y="690" width="400" height="100" rx="12"/><text x="640" y="721" class="title" text-anchor="middle"><tspan x="640" dy="0">Is onSession declared?</tspan></text><text x="640" y="749" class="body" text-anchor="middle"><tspan x="640" dy="0">No setup metadata also skips this phase</tspan></text></g><g data-node="skip"><rect class="box note" x="40" y="860" width="340" height="100" rx="12"/><text x="210" y="891" class="title" text-anchor="middle"><tspan x="210" dy="0">No session hook</tspan></text><text x="210" y="919" class="body" text-anchor="middle"><tspan x="210" dy="0">Continue module loading</tspan></text></g><g data-node="valid"><rect class="box run" x="460" y="860" width="360" height="100" rx="12"/><text x="640" y="891" class="title" text-anchor="middle"><tspan x="640" dy="0">Is sessionKey valid?</tspan></text><text x="640" y="919" class="body" text-anchor="middle"><tspan x="640" dy="0">Must be a non-empty string</tspan></text></g><g data-node="missing"><rect class="box error" x="900" y="860" width="340" height="130" rx="12"/><text x="1070" y="891" class="title" text-anchor="middle"><tspan x="1070" dy="0">MFU-013</tspan></text><text x="1070" y="919" class="body" text-anchor="middle"><tspan x="1070" dy="0">Hook declared but generation missing</tspan><tspan x="1070" dy="23">Fail this load; do not return module</tspan></text></g><g data-node="dedup"><rect class="box run" x="460" y="1050" width="360" height="115" rx="12"/><text x="640" y="1081" class="title" text-anchor="middle"><tspan x="640" dy="0">Successful/in-flight generation exists?</tspan></text><text x="640" y="1109" class="body" text-anchor="middle"><tspan x="640" dy="0">Success: reuse; pending: await</tspan></text></g><g data-node="reuse"><rect class="box note" x="40" y="1050" width="340" height="115" rx="12"/><text x="210" y="1081" class="title" text-anchor="middle"><tspan x="210" dy="0">Do not repeat onSession</tspan></text><text x="210" y="1109" class="body" text-anchor="middle"><tspan x="210" dy="0">Reuse the same generation Promise</tspan></text></g><g data-node="session"><rect class="box run" x="460" y="1250" width="360" height="130" rx="12"/><text x="640" y="1281" class="title" text-anchor="middle"><tspan x="640" dy="0">Run this generation’s onSession</tspan></text><text x="640" y="1309" class="body" text-anchor="middle"><tspan x="640" dy="0">Invalidate old signal; serialize generations</tspan><tspan x="640" dy="23">Check signal before async business writes</tspan></text></g><g data-node="environment"><rect class="box run" x="290" y="1465" width="700" height="120" rx="12"/><text x="640" y="1496" class="title" text-anchor="middle"><tspan x="640" dy="0">Install/deliver consumer environment declarations</tspan></text><text x="640" y="1524" class="body" text-anchor="middle"><tspan x="640" dy="0">Vue global registration; deliver pageProviders to adapter</tspan><tspan x="640" dy="23">Manual loadRemote does not wrap the rendered component tree</tspan></text></g><g data-node="get"><rect class="box run" x="290" y="1665" width="700" height="120" rx="12"/><text x="640" y="1696" class="title" text-anchor="middle"><tspan x="640" dy="0">Get exposed module: reuse successful cache</tspan></text><text x="640" y="1724" class="body" text-anchor="middle"><tspan x="640" dy="0">container.get(&apos;./expose&apos;)</tspan><tspan x="640" dy="23">Cache hits still pass the session checks above</tspan></text></g><g data-node="render"><rect class="box run" x="290" y="1865" width="700" height="120" rx="12"/><text x="640" y="1896" class="title" text-anchor="middle"><tspan x="640" dy="0">Return module; adapter wraps and renders</tspan></text><text x="640" y="1924" class="body" text-anchor="middle"><tspan x="640" dy="0">remoteComponent applies required Providers and renders</tspan><tspan x="640" dy="23">Plain loadRemote returns the namespace for business code</tspan></text></g><text x="40" y="2065" class="body" text-anchor="start"><tspan x="40" dy="0">Bare loadRemote(&quot;remote&quot;) returns the container without setup/onSession. This flow uses a full module spec.</tspan><tspan x="40" dy="23">Preloading is not initialization. Successful cached modules and same-generation onSession results are reused.</tspan><tspan x="40" dy="23">Dashed arrows indicate optional/skipped paths. Errors terminate this attempt; recovery depends on the error.</tspan></text><text x="300" y="725" class="edge-label" text-anchor="middle"><tspan x="300" dy="0">not declared</tspan></text><text x="690" y="827" class="edge-label" text-anchor="middle"><tspan x="690" dy="0">declared</tspan></text><text x="860" y="894" class="edge-label" text-anchor="middle"><tspan x="860" dy="0">invalid</tspan></text><text x="685" y="1010" class="edge-label" text-anchor="middle"><tspan x="685" dy="0">valid</tspan></text><text x="420" y="1090" class="edge-label" text-anchor="middle"><tspan x="420" dy="0">yes</tspan></text><text x="825" y="1212" class="edge-label" text-anchor="middle"><tspan x="825" dy="0">new generation / failed retry</tspan></text><text x="850" y="1420" class="edge-label" text-anchor="middle"><tspan x="850" dy="0">success; failure rejects this load</tspan></text></svg>
