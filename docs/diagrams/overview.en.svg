<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1280 1550" width="1280" height="1550" role="img" lang="en" aria-labelledby="title description"><title id="title">fulgurjs: system architecture and three integration paths</title><desc id="description">Development/build, resource serving and browser execution; no integration path requires another.</desc><style>:root{--bg:#fff;--text:#172b43;--muted:#465c72;--line:#526b85;--tool:#e8f5ef;--run:#e6f5fc;--resource:#fff3df;--note:#f1f4f8;--error:#fff0f1;--error-line:#b91c36;--border:#c1ccd8} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}} :root[data-theme="dark"]{--bg:#111b29;--text:#edf4fb;--muted:#c1cfdf;--line:#a3bdd5;--tool:#173b32;--run:#16384b;--resource:#44351e;--note:#233146;--error:#491d2b;--error-line:#ff829b;--border:#60758c}
.diagram{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text)}
.diagram .background{fill:var(--bg)}.diagram text{fill:var(--text)}
.diagram .heading{font-size:25px;font-weight:700}.diagram .section{font-size:18px;font-weight:700}
.diagram .title{font-size:18px;font-weight:700}.diagram .body{font-size:15px;fill:var(--muted)}
.diagram .edge-label{font-size:14px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.diagram .box{stroke:var(--border);stroke-width:1.5;fill:var(--note)}
.diagram .tool{fill:var(--tool)}.diagram .run{fill:var(--run)}.diagram .resource{fill:var(--resource)}
.diagram .error{fill:var(--error);stroke:var(--error-line)}
.diagram .boundary{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:7 5}
.diagram .edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}
.diagram .optional{stroke-dasharray:7 5}.diagram .failure{stroke:var(--error-line);marker-end:url(#error-arrow)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--line)"/></marker><marker id="error-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8Z" fill="var(--error-line)"/></marker></defs><rect class="background" width="1280" height="1550"/><text class="heading" x="30" y="40">fulgurjs: system architecture and three integration paths</text><path class="edge " d="M 235 214 L 235 240 L 440 240 L 440 260"/><path class="edge " d="M 645 214 L 645 260"/><path class="edge optional" d="M 1000 354 L 1050 354 L 1050 390"/><path class="edge " d="M 440 354 L 440 370 L 235 370 L 235 390"/><path class="edge " d="M 640 354 L 640 390"/><path class="edge optional" d="M 645 490 L 645 565 L 325 565 L 325 575"/><path class="edge " d="M 610 630 L 670 630"/><path class="edge optional" d="M 235 490 L 235 515 L 955 515 L 955 575"/><path class="edge " d="M 645 825 L 645 790 L 955 790 L 955 690"/><path class="edge " d="M 235 882 L 450 882"/><path class="edge " d="M 840 882 L 860 882"/><path class="edge " d="M 235 1020 L 235 980 L 580 980 L 580 940"/><path class="edge " d="M 645 1020 L 645 940"/><path class="edge " d="M 1050 1020 L 1050 960 L 770 960 L 770 940"/><path class="edge optional" d="M 840 910 L 850 910 L 850 1230 L 645 1230 L 645 1260"/><path class="edge " d="M 1050 1160 L 1050 1260"/><path class="edge optional" d="M 235 1260 L 235 1230 L 10 1230 L 10 735 L 955 735 L 955 690"/><rect class="boundary" x="20" y="70" width="1240" height="440" rx="16"/><text x="38" y="99" class="section" text-anchor="start"><tspan x="38" dy="0">1. Local Node.js tools: each host and remote integrates separately</tspan></text><g data-node="host"><rect class="box tool" x="40" y="120" width="390" height="94" rx="12"/><text x="235" y="151" class="title" text-anchor="middle"><tspan x="235" dy="0">Host source and configuration</tspan></text><text x="235" y="179" class="body" text-anchor="middle"><tspan x="235" dy="0">fulgurjs.config.ts + vite.config.ts</tspan></text></g><g data-node="remote"><rect class="box tool" x="450" y="120" width="390" height="94" rx="12"/><text x="645" y="151" class="title" text-anchor="middle"><tspan x="645" dy="0">Remote source and configuration</tspan></text><text x="645" y="179" class="body" text-anchor="middle"><tspan x="645" dy="0">exposes / setup / remotes / shared</tspan></text></g><g data-node="cli"><rect class="box tool" x="860" y="120" width="380" height="94" rx="12"/><text x="1050" y="151" class="title" text-anchor="middle"><tspan x="1050" dy="0">fulgurjs CLI</tspan></text><text x="1050" y="179" class="body" text-anchor="middle"><tspan x="1050" dy="0">create / init / explain / types</tspan><tspan x="1050" dy="23">check-pages / doctor / port</tspan></text></g><g data-node="plugin"><rect class="box tool" x="280" y="260" width="720" height="94" rx="12"/><text x="640" y="291" class="title" text-anchor="middle"><tspan x="640" dy="0">Each project’s own Vite plugin instance</tspan></text><text x="640" y="319" class="body" text-anchor="middle"><tspan x="640" dy="0">federation(options) · transform / virtual / shared facade</tspan></text></g><g data-node="serve"><rect class="box tool" x="40" y="390" width="390" height="100" rx="12"/><text x="235" y="421" class="title" text-anchor="middle"><tspan x="235" dy="0">serve: development endpoints</tspan></text><text x="235" y="449" class="body" text-anchor="middle"><tspan x="235" dy="0">@fulgurjs-entry.js / manifest / types</tspan></text></g><g data-node="build"><rect class="box tool" x="450" y="390" width="390" height="100" rx="12"/><text x="645" y="421" class="title" text-anchor="middle"><tspan x="645" dy="0">build: Rollup / Rolldown</tspan></text><text x="645" y="449" class="body" text-anchor="middle"><tspan x="645" dy="0">remoteEntry / chunks / CSS</tspan></text></g><g data-node="dts"><rect class="box tool" x="860" y="390" width="380" height="100" rx="12"/><text x="1050" y="421" class="title" text-anchor="middle"><tspan x="1050" dy="0">Type generation/sync (optional)</tspan></text><text x="1050" y="449" class="body" text-anchor="middle"><tspan x="1050" dy="0">Tooling, not business execution</tspan><tspan x="1050" dy="23">manifest / dts</tspan></text></g><rect class="boundary" x="20" y="525" width="1240" height="200" rx="16"/><text x="38" y="554" class="section" text-anchor="start"><tspan x="38" dy="0">2. Resource serving: dev server or production HTTP hosting</tspan></text><g data-node="files"><rect class="box resource" x="40" y="575" width="570" height="115" rx="12"/><text x="325" y="606" class="title" text-anchor="middle"><tspan x="325" dy="0">Independent project outputs</tspan></text><text x="325" y="634" class="body" text-anchor="middle"><tspan x="325" dy="0">Host HTML/chunks; remote entry, modules, CSS</tspan><tspan x="325" dy="23">manifest / dts enabled by default, optional</tspan></text></g><g data-node="http"><rect class="box resource" x="670" y="575" width="570" height="115" rx="12"/><text x="955" y="606" class="title" text-anchor="middle"><tspan x="955" dy="0">Vite dev server / HTTP / CDN</tspan></text><text x="955" y="634" class="body" text-anchor="middle"><tspan x="955" dy="0">Production cache, CORS and SPA fallback: deployment</tspan><tspan x="955" dy="23">Remote code executes in the consuming browser</tspan></text></g><rect class="boundary" x="20" y="760" width="1240" height="730" rx="16"/><text x="38" y="789" class="section" text-anchor="start"><tspan x="38" dy="0">3. Browser execution: one realm; three parallel integration paths</tspan></text><g data-node="runtime"><rect class="box run" x="40" y="825" width="390" height="115" rx="12"/><text x="235" y="856" class="title" text-anchor="middle"><tspan x="235" dy="0">Page-level runtime singleton</tspan></text><text x="235" y="884" class="body" text-anchor="middle"><tspan x="235" dy="0">globalThis.__FULGURJS_RUNTIME__</tspan><tspan x="235" dy="23">Share registry / shareScope × shareKey</tspan></text></g><g data-node="load"><rect class="box run" x="450" y="825" width="390" height="115" rx="12"/><text x="645" y="856" class="title" text-anchor="middle"><tspan x="645" dy="0">Remote loading and initialization</tspan></text><text x="645" y="884" class="body" text-anchor="middle"><tspan x="645" dy="0">loadRemote · init · setup / onSession</tspan><tspan x="645" dy="23">See the module-loading flow</tspan></text></g><g data-node="context"><rect class="box run" x="860" y="825" width="380" height="115" rx="12"/><text x="1050" y="856" class="title" text-anchor="middle"><tspan x="1050" dy="0">AppContext</tspan></text><text x="1050" y="884" class="body" text-anchor="middle"><tspan x="1050" dy="0">Page-level snapshots + function references</tspan><tspan x="1050" dy="23">Not an automatic cross-framework reactive bus</tspan></text></g><g data-node="components"><rect class="box run" x="40" y="1020" width="390" height="140" rx="12"/><text x="235" y="1051" class="title" text-anchor="middle"><tspan x="235" dy="0">Path 1: components / modules</tspan></text><text x="235" y="1079" class="body" text-anchor="middle"><tspan x="235" dy="0">remoteComponent / loadRemote</tspan><tspan x="235" dy="23">useLoadRemote (React)</tspan><tspan x="235" dy="23">No page table or full-app bridge</tspan></text></g><g data-node="pages"><rect class="box run" x="450" y="1020" width="390" height="140" rx="12"/><text x="645" y="1051" class="title" text-anchor="middle"><tspan x="645" dy="0">Path 2: per-page integration</tspan></text><text x="645" y="1079" class="body" text-anchor="middle"><tspan x="645" dy="0">definePages / createHostPages</tspan><tspan x="645" dy="23">createReactHostPages</tspan><tspan x="645" dy="23">Host owns page table, menus, routes</tspan></text></g><g data-node="bridge"><rect class="box run" x="860" y="1020" width="380" height="140" rx="12"/><text x="1050" y="1051" class="title" text-anchor="middle"><tspan x="1050" dy="0">Path 3: full application bridge</tspan></text><text x="1050" y="1079" class="body" text-anchor="middle"><tspan x="1050" dy="0">createVueBridgeApp</tspan><tspan x="1050" dy="23">createReactBridgeApp</tspan><tspan x="1050" dy="23">Child owns routing, state, lifecycle</tspan></text></g><g data-node="preload"><rect class="box run" x="40" y="1260" width="390" height="140" rx="12"/><text x="235" y="1291" class="title" text-anchor="middle"><tspan x="235" dy="0">Resource preloading: optional</tspan></text><text x="235" y="1319" class="body" text-anchor="middle"><tspan x="235" dy="0">preloadRemote</tspan><tspan x="235" dy="23">No business execution or setup/onSession</tspan><tspan x="235" dy="23">Stylesheets can still affect global styles</tspan></text></g><g data-node="environment"><rect class="box run" x="450" y="1260" width="390" height="140" rx="12"/><text x="645" y="1291" class="title" text-anchor="middle"><tspan x="645" dy="0">Component environment and state</tspan></text><text x="645" y="1319" class="body" text-anchor="middle"><tspan x="645" dy="0">globalComponents / pageProviders</tspan><tspan x="645" dy="23">Applied per consumer app / render</tspan><tspan x="645" dy="23">Shared Pinia library ≠ shared business stores</tspan></text></g><g data-node="contract"><rect class="box run" x="860" y="1260" width="380" height="140" rx="12"/><text x="1050" y="1291" class="title" text-anchor="middle"><tspan x="1050" dy="0">Contract / DOM mount instances</tspan></text><text x="1050" y="1319" class="body" text-anchor="middle"><tspan x="1050" dy="0">defineApplication / defineBridgeApp</tspan><tspan x="1050" dy="23">Business factory called inside each mount</tspan><tspan x="1050" dy="23">session / URL sync enabled as needed</tspan></text></g><text x="40" y="1470" class="body" text-anchor="start"><tspan x="40" dy="0">Solid: calls/dependencies/requests. Dashed: generation, deployment or optional paths. Resource responses return along requests.</tspan></text><text x="40" y="1530" class="body" text-anchor="start"><tspan x="40" dy="0">No framework component conversion: use full-app bridging for Vue/React UI.</tspan></text><text x="1125" y="365" class="edge-label" text-anchor="middle"><tspan x="1125" dy="0">generate / sync</tspan></text><text x="640" y="617" class="edge-label" text-anchor="middle"><tspan x="640" dy="0">serve</tspan></text><text x="1070" y="502" class="edge-label" text-anchor="middle"><tspan x="1070" dy="0">dev endpoints</tspan></text><text x="1080" y="778" class="edge-label" text-anchor="middle"><tspan x="1080" dy="0">request entry/resources</tspan></text><text x="440" y="810" class="edge-label" text-anchor="middle"><tspan x="440" dy="0">runtime services</tspan></text><text x="850" y="870" class="edge-label" text-anchor="middle"><tspan x="850" dy="0">read</tspan></text><text x="365" y="968" class="edge-label" text-anchor="middle"><tspan x="365" dy="0">loadRemote</tspan></text><text x="705" y="985" class="edge-label" text-anchor="middle"><tspan x="705" dy="0">loadRemote</tspan></text><text x="1090" y="978" class="edge-label" text-anchor="middle"><tspan x="1090" dy="0">loadRemote</tspan></text><text x="665" y="1215" class="edge-label" text-anchor="middle"><tspan x="665" dy="0">Component consumer environment (optional)</tspan></text><text x="1140" y="1210" class="edge-label" text-anchor="middle"><tspan x="1140" dy="0">mount / unmount</tspan></text><text x="150" y="1218" class="edge-label" text-anchor="middle"><tspan x="150" dy="0">resource hints only</tspan></text></svg>
